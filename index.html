    height: 100%; border-radius: 99px; transition: width 0.4s;

    border-radius: 12px; overflow: hidden;

  .prod-card-tagline { font-size: 11px; color: #64748b; letter-spacing: 1px; }

UPDATE employees

  const container = document.getElementById('tabs');

          <div style="margin-bottom:10px">
            <span class="prod-usedfor-label" style="color:${prod.color}">USED FOR</span>
            <p class="prod-usedfor-text">${prod.usedFor}</p>
          </div>
          <div>
            <span class="prod-features-label" style="color:${prod.color}">KEY FEATURES</span>
            <div style="margin-top:8px;display:flex;flex-wrap:wrap">
              ${prod.keyFeatures.map(f => `<span class="badge" style="background:${prod.color}22;color:${prod.color};border:1px solid ${prod.color}44">${f}</span>`).join('')}
            </div>
          </div>
        </div>`;
    });
    content.innerHTML = html;
    return;
  }

  // Q&A view
  let html = `
    <div id="progress-bar-wrap" style="border: 1px solid ${topic.color}30">
      <span class="progress-label" style="color:${topic.accent}">Progress</span>
      <div class="progress-track">
        <div class="progress-fill" style="width:${(doneCount/qa.length)*100}%;background:linear-gradient(90deg,${topic.color},${topic.accent})"></div>
      </div>
      <span class="progress-count">${doneCount}/${qa.length}</span>
    </div>
    <div id="qa-list">`;

  qa.forEach((item, i) => {
    const key = `${activeTab}-${i}`;
    const isOpen = openQ === key;
    const isKnown = !!known[key];
    const showAns = !!showAnswer[key];

    html += `
      <div class="qa-card" style="background:${isKnown ? topic.color+'12' : '#0f172a'};border:1px solid ${isKnown ? topic.color+'50' : isOpen ? topic.color+'40' : '#1e293b'}">
        <div class="qa-header" onclick="toggleOpen('${key}')">
          <span class="qa-num">Q${i+1}</span>
          <span class="qa-question" style="color:${isKnown ? '#64748b' : '#e2e8f0'};text-decoration:${isKnown ? 'line-through' : 'none'}">${item.q}</span>
          <button class="qa-check" onclick="event.stopPropagation();toggleKnown('${key}')"
            style="border:2px solid ${isKnown ? topic.color : '#334155'};background:${isKnown ? topic.color : 'transparent'}">
            ${isKnown ? '✓' : ''}
          </button>
          <span class="qa-arrow">${isOpen ? '▲' : '▼'}</span>
        </div>`;

    if (isOpen) {
      html += `
        <div class="qa-body">
          <div class="theory-block" style="border-left:3px solid ${topic.color}">
            <div style="font-size:10px;color:${topic.color};font-weight:700;letter-spacing:2px;margin-bottom:6px">📖 THEORY / EXPLANATION</div>
            ${escapeHtml(item.theory)}
          </div>
          <button class="qa-code-toggle" onclick="toggleAnswer('${key}')"
            style="border:1px solid ${topic.color}40;background:${showAns ? topic.color+'22' : 'transparent'};color:${topic.accent};margin-bottom:${showAns ? '12px' : '0'}">
            ${showAns ? '▲ Hide' : '▼ Show'} ${activeTab === 'Zoho' ? 'Details / Diagram' : 'Code Example'}
          </button>
          ${showAns ? `<div class="code-block">${escapeHtml(item.code)}</div>` : ''}
        </div>`;
    }

    html += `</div>`;
  });

  html += `</div>
    <div id="footer-tip">Click question to expand · ▼ Show Code for examples · ✓ checkbox to mark as known</div>`;

  content.innerHTML = html;
}

function setView(mode) {
  viewMode = mode;
  render();
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Initial render
render();
</script>
</body>
</html>
