<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoho Products — Deep Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #070b14;
    color: #e2e8f0;
    font-family: 'Sora', 'Segoe UI', sans-serif;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 4px; }

  .prod-tab { transition: all 0.2s; border: none; cursor: pointer; font-family: inherit; }
  .prod-tab:hover { transform: translateY(-1px); }
  .sec-btn { transition: all 0.18s; border: none; cursor: pointer; font-family: inherit; }
  .sec-btn:hover { transform: translateX(3px); }

  .code-pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.75;
    white-space: pre-wrap;
    word-break: break-word;
    color: #a5f3fc;
    background: #010a12;
    border: 1px solid #1e3a4a;
    border-radius: 12px;
    padding: 20px;
    margin: 0;
  }
  .badge-chip {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .glow-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; margin-right: 8px;
  }
  button { cursor: pointer; }

  /* ── HEADER ── */
  #top-header {
    background: #0a0e1a;
    border-bottom: 1px solid #1a2035;
    padding: 18px 20px 0;
    position: sticky; top: 0; z-index: 100;
  }
  #header-inner { max-width: 1100px; margin: 0 auto; }
  #header-title-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  #header-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #F59E0B, #EF4444);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  #header-title { font-weight: 800; font-size: 17px; letter-spacing: -0.3px; }
  #header-sub { font-size: 11px; color: #4a5568; letter-spacing: 1px; }

  #product-tabs {
    display: flex; gap: 4px; overflow-x: auto; padding-bottom: 0;
  }
  .prod-tab {
    flex-shrink: 0;
    padding: 10px 14px 12px;
    border-radius: 10px 10px 0 0;
    background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 12px;
  }
  .prod-tab .tab-icon { font-size: 18px; }
  .prod-tab .tab-name { white-space: nowrap; }
  .prod-tab .tab-progress { font-size: 10px; }

  /* ── MAIN LAYOUT ── */
  #main-layout {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    min-height: calc(100vh - 120px);
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 230px; flex-shrink: 0;
    background: #0a0e1a;
    border-right: 1px solid #1a2035;
    padding: 20px 12px;
    position: sticky; top: 120px;
    height: calc(100vh - 120px);
    overflow-y: auto;
  }
  #prod-overview-card {
    border-radius: 10px; padding: 12px; margin-bottom: 16px;
  }
  #prod-overview-icon { font-size: 22px; margin-bottom: 4px; }
  #prod-overview-name { font-weight: 700; font-size: 13px; }
  #prod-overview-tagline { font-size: 10px; color: #4a5568; margin-top: 2px; line-height: 1.5; }
  #prod-overview-progress { margin-top: 8px; height: 4px; background: #1a2035; border-radius: 99px; }
  #prod-overview-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  #prod-overview-count { font-size: 10px; color: #4a5568; margin-top: 4px; }
  #sections-label { font-size: 10px; color: #2d3748; letter-spacing: 1px; margin-bottom: 8px; padding: 0 4px; }

  .sec-btn {
    width: 100%; text-align: left;
    padding: 9px 10px; margin-bottom: 4px;
    border-radius: 8px;
    background: transparent;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px;
  }
  .sec-btn .sec-icon { font-size: 14px; flex-shrink: 0; }
  .sec-btn .sec-check { margin-left: auto; font-size: 12px; flex-shrink: 0; }

  /* ── CONTENT AREA ── */
  #content-area {
    flex: 1; padding: 28px; overflow-y: auto;
  }

  /* Product hero */
  #product-hero {
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
  }
  #hero-inner { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  #hero-icon { font-size: 48px; }
  #hero-details { flex: 1; min-width: 200px; }
  #hero-name { font-weight: 800; font-size: 22px; color: #f1f5f9; }
  #hero-tagline { font-size: 13px; margin-bottom: 10px; }
  #hero-overview { font-size: 13px; color: #94a3b8; line-height: 1.7; margin-bottom: 12px; }
  .hero-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; }
  .hero-text { margin: 3px 0 0; font-size: 12px; color: #718096; line-height: 1.6; }

  /* Section content box */
  #section-box {
    background: #0d1117;
    border: 1px solid #1a2035;
    border-radius: 14px; padding: 24px;
  }
  #section-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  #section-icon-box {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  #section-title { font-weight: 800; font-size: 18px; color: #f1f5f9; }
  #section-product-label { font-size: 11px; letter-spacing: 1px; font-weight: 600; }
  #section-divider { height: 1px; background: #1a2035; margin-bottom: 20px; }

  /* Nav buttons */
  #nav-btns { display: flex; gap: 10px; margin-top: 20px; }
  .nav-prev {
    padding: 10px 18px; border-radius: 10px;
    border: 1px solid #1a2035; background: transparent;
    color: #718096; font-family: inherit;
    font-size: 13px; font-weight: 600;
  }
  .nav-next {
    padding: 10px 20px; border-radius: 10px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    margin-left: auto;
  }
  #complete-msg { margin-left: auto; font-size: 13px; font-weight: 700; padding: 10px 0; }

  #bottom-hint { font-size: 11px; color: #2d3748; text-align: center; margin-top: 16px; }

  @media (max-width: 700px) {
    #sidebar { display: none; }
    #main-layout { flex-direction: column; }
    #content-area { padding: 16px; }
  }
</style>
</head>
